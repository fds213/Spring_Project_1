name: CI

on:
  pull_request:
    # edited: 쌓인 PR의 base를 develop으로 바꿀 때도 다시 돈다(제목·본문 수정에도 돈다)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: 빌드와 단위 테스트
        run: mvn -B -ntp clean verify

  # 임시 Oracle에 db/ 스크립트를 넣고 Mapper SQL을 EXPLAIN PLAN으로 검사한다. 없는 표·칼럼과 문법 오류를 잡는다.
  # build와 따로 돌고 필수 검사가 아니다. 값은 이 job 안에서만 쓰는 임시 DB의 비밀번호다.
  db-check:
    name: db-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: ci_only_1234
          APP_USER: ieum
          APP_USER_PASSWORD: ci_only_1234
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: DB 스크립트 적용
        run: bash .github/scripts/apply-db-scripts.sh "${{ job.services.oracle.id }}" XEPDB1 ci_only_1234
      - name: Mapper SQL 검사
        env:
          IEUM_DB_CHECK_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
          IEUM_DB_CHECK_USER: ieum
          IEUM_DB_CHECK_PASSWORD: ci_only_1234
        run: mvn -B -ntp -Dtest=MapperSqlCheckIT test
