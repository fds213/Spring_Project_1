<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지문 단말기 시뮬레이터</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/common.css">
  <style>
    body { overflow: auto; display: block; background: var(--bg-sub); }
    .sim { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    .sim-head { display: flex; align-items: center; gap: 10px; }
    .sim-head img { height: 26px; }
    .sim-head strong { font-weight: 500; }
    .demo-badge { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #faeeda; color: #854f0b; }
    .panel { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 14px; }
    .clock { text-align: center; }
    .clock .time { font-size: 44px; font-weight: 500; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .clock .date { color: var(--text-sub); font-size: 13px; }
    .override { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--text-sub); }
    .override input[type="time"] { height: 32px; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 8px; font: inherit; }
    .section-title { font-size: 13px; color: var(--text-sub); margin: 0 0 10px; }
    .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .person {
      min-height: 56px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
      font: inherit; text-align: left; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
    }
    .person:hover { background: var(--bg-sub); }
    .person[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
    .person small { color: var(--text-muted); font-size: 12px; }
    .scan { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .finger {
      width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg);
      display: grid; place-items: center; cursor: pointer; color: var(--text-sub);
    }
    .finger:hover { border-color: var(--accent); color: var(--accent); }
    .finger.scanning { border-color: var(--accent); color: var(--accent); animation: pulse 0.6s ease-in-out infinite alternate; }
    @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(24, 95, 165, 0.25); } to { box-shadow: 0 0 0 14px rgba(24, 95, 165, 0); } }
    @media (prefers-reduced-motion: reduce) { .finger.scanning { animation: none; } }
    .scan-hint { font-size: 13px; color: var(--text-sub); }
    .result { text-align: center; min-height: 72px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .result .big { font-size: 22px; font-weight: 500; }
    .result.ok { color: #0f6e56; }
    .result.warn { color: #854f0b; }
    .result.err { color: var(--danger); }
    .result.idle { color: var(--text-muted); }
    pre { margin: 0; background: var(--bg-sub); border-radius: var(--radius); padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre; }
    .log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
    .log li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .log li:last-child { border-bottom: 0; }
    .log .muted { color: var(--text-muted); }
    .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 13px; }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <!-- 시연 전용 화면: 실제로는 지문 단말기가 POST /api/attendance/punch 를 호출한다 (가이드 9번 섹션) -->
  <div class="sim">
    <div class="sim-head">
      <img src="img/logo-mark.png" alt="">
      <strong>지문 단말기 (시연용)</strong>
      <span class="demo-badge">시연용 단말기</span>
    </div>

    <div class="panel clock">
      <div class="time" id="clock">--:--:--</div>
      <div class="date" id="today"></div>
      <label class="override">
        <input type="checkbox" id="useOverride"> 시각 지정(시연용)
        <input type="time" id="overrideTime" value="09:10">
      </label>
    </div>

    <div class="panel">
      <p class="section-title">1. 지문을 댈 사람 고르기</p>
      <div class="people" id="people"></div>
    </div>

    <div class="panel scan">
      <p class="section-title">2. 지문 대기</p>
      <button type="button" class="finger" id="finger" aria-label="지문 대기">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path d="M7 19.5c-1.2-2-1.8-4.4-1.8-7a6.8 6.8 0 0 1 13.6 0"/>
          <path d="M9.6 20.5c-.9-2.2-1.4-4.8-1.4-8a3.8 3.8 0 0 1 7.6 0c0 1.4-.1 2.7-.3 4"/>
          <path d="M12 12.5c0 3.2.5 5.9 1.6 8.3"/>
          <path d="M16.6 19.8c.6-1.7 1-3.7 1.1-5.8"/>
          <path d="M4.6 8.5A8.8 8.8 0 0 1 12 3.7c2.4 0 4.6.9 6.2 2.5"/>
        </svg>
      </button>
      <span class="scan-hint" id="scanHint">사람을 고른 뒤 지문 버튼을 누르세요</span>
    </div>

    <div class="panel result idle" id="result" aria-live="polite">
      <div class="big">지문을 대 주세요</div>
      <div id="resultSub"></div>
    </div>

    <div class="panel">
      <p class="section-title">보낸 요청 (실제 서버라면)</p>
      <pre id="request">아직 보낸 요청이 없습니다</pre>
    </div>

    <div class="panel">
      <p class="section-title">최근 기록</p>
      <ul class="log" id="log"><li class="muted">기록이 없습니다</li></ul>
    </div>

    <div class="foot">
      <a href="index.html">그룹웨어 화면으로</a>
      <button class="btn" id="btnReset">오늘 기록 초기화</button>
    </div>
  </div>

  <script src="js/simulator.js"></script>
</body>
</html>
